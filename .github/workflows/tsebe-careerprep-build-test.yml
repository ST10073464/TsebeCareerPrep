
name: Tsebe CareerPrep | Build & Test

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TsebeCareerPrep.slnx

      - name: Build Solution
        run: dotnet build TsebeCareerPrep.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test TsebeCareerPrep.slnx --configuration Release --no-build
